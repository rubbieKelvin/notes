[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs", "builder", "hostname"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.11.0", features = ["server", "transport-streamable-http-server", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
yrs = { version = "0.28.2", features = ["sync"] }
