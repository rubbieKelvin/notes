{% macro button(href, label) %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
  <tr>
    <td style="border-radius:8px;background:#15803d;">
      <a href="{{ href | safe }}" style="display:inline-block;padding:12px 24px;font-size:15px;font-weight:500;color:#ffffff;text-decoration:none;border-radius:8px;">{{ label }}</a>
    </td>
  </tr>
</table>
{% endmacro %}
