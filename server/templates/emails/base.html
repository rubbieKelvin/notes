<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin:0;padding:0;background:#fafaf9;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#171717;">
    {% if preheader %}
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>
    {% endif %}
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fafaf9;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e7e7e5;">
            <tr>
              <td style="padding:24px 32px;border-bottom:1px solid #f5f5f4;">
                <span style="display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:6px;background:#15803d;color:#ffffff;font-size:13px;font-weight:500;vertical-align:middle;">o</span>
                <span style="font-size:16px;font-weight:500;color:#171717;vertical-align:middle;margin-left:6px;">opennotes</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;font-size:15px;line-height:1.6;color:#404040;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;border-top:1px solid #f5f5f4;font-size:12px;line-height:1.5;color:#a3a3a1;">
                {% block footer %}You're receiving this because someone used this address on opennotes.{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
