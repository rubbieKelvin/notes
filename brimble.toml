#:schema https://brimble.io/schema/brimble.json
# Brimble deploy: one Rust service (API + web app) → managed Postgres.
# Reference: https://paper.brimble.io/config-as-code/reference

# Rust server: serves the API, the sync WebSocket, /mcp and the built web app from one origin
# (cookies and the sync origin check need that). Image built from the root Dockerfile.
[services.opennotes]
type = "web"
region = "eu-central"
root = "." # repo root, so the root Dockerfile builds; removing the line would keep the old "server"

[services.opennotes.build]
dockerfile = "Dockerfile" # repo root: builds apps/web, then the server, into one slim image
watch = ["server/**", "apps/web/**", "Dockerfile", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
cache = true

[services.opennotes.deploy]
port = 8080
health = "/health"
# migrations run inside the server on startup; no before_start needed

[services.opennotes.resources]
cpu = 0.5
memory = "512mb"

[services.opennotes.network]
public = true
domains = ["notes.rubbietheone.com"]
headers = { frame = "DENY", nosniff = true, hsts = true }

[services.opennotes.env]
BIND = "0.0.0.0:8080"
COOKIE_SECURE = "true"
ALLOW_SIGNUP = "true"
ALLOW_PRIVATE_AI_URLS = "false"
LOG_FORMAT = "json"
RUST_LOG = "info"
STORAGE_DRIVER = "s3"
EMAIL_DRIVER = "resend"
# Brimble sits behind Cloudflare, which overwrites this header with the visitor's address (guest-comment rate limit).
CLIENT_IP_HEADER = "cf-connecting-ip"

# Set in the dashboard; deploys are blocked until each exists.
PUBLIC_URL = "https://notes.rubbietheone.com"
OPENNOTES_HOSTS = "notes.rubbietheone.com"
EMAIL_FROM = "OpenNotes <no-reply@notes.rubbietheone.com>"
DATABASE_URL = "{{@opennotes-db.PRIVATE_CONNECTION_STRING}}"

[services.opennotes.secrets]
required = ["OPENNOTES_SECRET", "EMAIL_RESEND_API_KEY", "AWS_BUCKET", "AWS_REGION", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY"]

[databases.opennotes-db]
engine = "postgresql"
version = "18"
region = "eu-central"
cpu = 0.5
memory = "1gb"
disk = "10gb"
public = false
tls = true
backups = { schedule = "0 2 * * *", timezone = "UTC", keep = "14d" }
