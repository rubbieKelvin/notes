#:schema https://brimble.io/schema/brimble.json
# Brimble deploy: nginx web app (public) → Rust API (private) → managed Postgres.
# Reference: https://paper.brimble.io/config-as-code/reference

# Static app + nginx proxy for /v1 (API, sync WebSocket) and /mcp, so the browser sees one origin
# (cookies and the sync origin check need that).
[services.opennotes-web]
type = "web"
region = "eu-central"

[services.opennotes-web.build]
dockerfile = "apps/web/Dockerfile" # build context is the repo root (pnpm workspace)
watch = ["apps/web/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]

[services.opennotes-web.deploy]
port = 80
health = "/"

[services.opennotes-web.env]
# <project-slug>.service.brimble.internal, plain http. Must match the API project's slug.
API_UPSTREAM = "opennotes.service.brimble.internal:8080"

[services.opennotes-web.network]
domains = ["opennotes.rubbietheone.com"]  # add yours; then set PUBLIC_URL and OPENNOTES_HOSTS on the API to match
headers = { frame = "DENY", nosniff = true, hsts = true }

# Rust server. Private: only the web service reaches it, so X-Real-IP always comes from our nginx.
[services.opennotes]
type = "web"
region = "eu-central"
root = "server"

[services.opennotes.build]
dockerfile = "Dockerfile" # final stage is the slim release image
watch = ["server/**"]

[services.opennotes.deploy]
port = 8080
health = "/health"
# migrations run inside the server on startup; no before_start needed

[services.opennotes.resources]
cpu = 0.5
memory = "512mb"

# Live sync rooms are held in memory: exactly one instance.
[services.opennotes.scale]
replicas = 1

[services.opennotes.network]
public = false

[services.opennotes.env]
DATABASE_URL = "{{@db.PRIVATE_CONNECTION_STRING}}"
BIND = "0.0.0.0:8080"
COOKIE_SECURE = "true"
ALLOW_SIGNUP = "true"
ALLOW_PRIVATE_AI_URLS = "false"
LOG_FORMAT = "json"
RUST_LOG = "info"
STORAGE_DRIVER = "s3"
EMAIL_DRIVER = "resend"

# Set in the dashboard; deploys are blocked until each exists.
PUBLIC_URL = "https://notes.rubbietheone.com"
OPENNOTES_HOSTS = "notes.rubbietheone.com"
EMAIL_FROM = "OpenNotes <no-reply@notes.rubbietheone.com>"
# Uploads go to an S3-compatible bucket via AWS_*. Also set AWS_ENDPOINT for non-AWS (e.g. R2; AWS_REGION = "auto").
[services.opennotes.secrets]
required = ["OPENNOTES_SECRET", "EMAIL_RESEND_API_KEY", "AWS_BUCKET", "AWS_REGION", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY"]

[databases.db]
engine = "postgresql"
region = "eu-central"
version = "18"
disk = "10gb"
backups = { schedule = "0 2 * * *", timezone = "UTC", keep = "14d" }
