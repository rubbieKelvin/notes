services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opennotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: opennotes
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennotes"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://opennotes:${POSTGRES_PASSWORD}@db:5432/opennotes
      OPENNOTES_SECRET: ${OPENNOTES_SECRET:?set OPENNOTES_SECRET in .env}
      BIND: 0.0.0.0:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      OPENNOTES_HOSTS: ${OPENNOTES_HOSTS:-localhost,127.0.0.1}
      ALLOW_PRIVATE_AI_URLS: ${ALLOW_PRIVATE_AI_URLS:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db:
